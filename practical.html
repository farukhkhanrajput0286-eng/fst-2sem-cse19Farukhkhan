<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Analyzer</title>
    <link rel="stylesheet" href="practical.css">
</head>
<body>

<div class="box">

    <h2>Student Performance Analyzer</h2>

    <input type="text" id="name" placeholder="Student Name">

    <input type="text" id="roll" placeholder="Roll Number">

    <input type="number" id="math" placeholder="Mathematics Marks">

    <input type="number" id="web" placeholder="Web Designing workshop">

    <input type="number" id="ai" placeholder="Artificial inteligence">

    <input type="number" id="ds" placeholder="Data Structure using c++">

    <input type="number" id="elc" placeholder="  Electronics  ">

    <button onclick="calculate()">Analyze Result</button>

    <button onclick="resetForm()">Reset</button>

    <div id="result"></div>

</div>

<script src="practical.js"></script>

</body>
</html>
